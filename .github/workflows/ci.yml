name: CI

on:
  push:
    branches: [main, '001-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # T134 — SFI compliance gate.
  # Runs first and fails the build (not warns) so a credential or a re-enabled local auth
  # path can never merge. Constitution Principle VII / SFI Safe Secrets Standard.
  # ---------------------------------------------------------------------------
  sfi-gate:
    name: SFI compliance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce credential-free and local-auth-disabled posture
        shell: pwsh
        run: ./tools/sfi-gate.ps1 -RepositoryRoot .

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Named explicitly rather than relying on root-directory auto-discovery, so a future
          # change to the action's default config resolution cannot silently drop the allowlist
          # and start failing the build on published Azure role IDs again.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    needs: [sfi-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      # NuGetAudit is on by default and TreatWarningsAsErrors is set in Directory.Build.props,
      # so a package with a known vulnerability fails restore. That is the dependency
      # vulnerability gate the constitution's Quality Gates require.
      - name: Restore (fails on vulnerable dependencies)
        run: dotnet restore BlinkMark.sln
      - name: Build
        run: dotnet build BlinkMark.sln --no-restore --configuration Release
      - name: Test
        run: >
          dotnet test BlinkMark.sln --no-build --configuration Release
          --logger "trx;LogFileName=backend.trx"
          --collect:"XPlat Code Coverage"
          --filter "Category!=Load"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/**'

  frontend:
    name: Frontend build, lint and test
    runs-on: ubuntu-latest
    needs: [sfi-gate]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # Two tiers, because "is this code a risk to a user" and "is this code a risk to us" are
      # different questions with different answers.
      #
      # Shipped dependencies are what lands in a browser, so an advisory there is a live exposure
      # and blocks the build with no exceptions.
      #
      # The dev tree is audited too — a compromised build-time dependency runs on developer
      # machines and in CI with credentials, which is precisely how the eslint and event-stream
      # incidents worked — but it is reported rather than blocking. As of 2026-07-26 the
      # brace-expansion advisory (GHSA-mh99-v99m-4gvg) affects *every published version* and the
      # whole ESLint and typescript-eslint tree depends on it, so there is no version of this
      # repository that can pass a blocking full-tree audit. Wedging CI on an advisory with no
      # available fix trains people to ignore it; leaving it visible does not.
      #
      # REVISIT when brace-expansion ships a patched release: delete this comment, drop
      # continue-on-error, and collapse the two steps back into one.
      - name: Dependency vulnerability scan (shipped dependencies)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Dependency vulnerability scan (full tree, advisory only)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Accessibility and end-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: |
            frontend/playwright-report/**
            frontend/test-results/**

  infra:
    name: Bicep validation
    runs-on: ubuntu-latest
    needs: [sfi-gate]
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Lint Bicep modules
        run: |
          set -e
          for f in infra/modules/*.bicep; do
            az bicep build --file "$f" --stdout > /dev/null
          done
